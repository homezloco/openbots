services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openbots
      POSTGRES_PASSWORD: openbots
      POSTGRES_DB: openbots
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbots"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: openbots-api
    env_file: .env
    environment:
      DATABASE_URL: postgres://openbots:openbots@postgres:5432/openbots
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/e2e/fixtures/testrepo:/tmp/testrepo:ro
      - ./apps/api/e2e/fixtures/writable-testrepo:/tmp/writable-testrepo:rw
      - ./apps/api/e2e/fixtures/writable-testrepo-outside:/tmp/writable-testrepo-outside:rw
      - ./apps/api/e2e/fixtures/writable-testrepo-remote.git:/tmp/writable-testrepo-remote.git:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Streamable-HTTP echo MCP used by the e2e suite (echo + secret_ping).
  # Worker DNS is http://mcp-echo:3930/mcp — keep that prefix in
  # ALLOWED_MCP_SERVERS alongside http://127.0.0.1:3930 for local pnpm dev.
  mcp-echo:
    build:
      context: ./apps/api/e2e/fixtures/mcp-echo
    ports:
      - "3930:3930"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3930/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    image: openbots-api
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://openbots:openbots@postgres:5432/openbots
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api/e2e/fixtures/testrepo:/tmp/testrepo:ro
      - ./apps/api/e2e/fixtures/writable-testrepo:/tmp/writable-testrepo:rw
      - ./apps/api/e2e/fixtures/writable-testrepo-outside:/tmp/writable-testrepo-outside:rw
      - ./apps/api/e2e/fixtures/writable-testrepo-remote.git:/tmp/writable-testrepo-remote.git:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      mcp-echo:
        condition: service_healthy

  # Self-hosted "local" run_code backend (Piston). Opt-in only — never
  # starts unless the operator runs `docker compose --profile
  # sandbox-local up`. Its own docker-compose.yaml upstream requires
  # `privileged: true` for its isolate-based sandboxing to manage
  # cgroups/namespaces itself; that's a property of the isolation
  # primitive, not something this wrapper controls. No `ports:` —
  # reachable only over the compose network by service name (see
  # PISTON_API_URL in .env.example), never published to the host.
  # One-time setup after first start: install the language runtimes with
  # `docker compose --profile sandbox-local exec sandbox cli/index.js ppman install python`
  # (and `node` for javascript) — see .env.example.
  sandbox:
    image: ghcr.io/engineer-man/piston
    profiles: ["sandbox-local"]
    privileged: true
    volumes:
      - piston-packages:/piston/packages
    healthcheck:
      # Piston's own image ships Node 15 — no global fetch() — so this
      # uses the http module instead, unlike this file's other
      # node-based healthchecks.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  piston-packages:
