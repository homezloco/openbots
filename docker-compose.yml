services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openbots
      POSTGRES_PASSWORD: openbots
      POSTGRES_DB: openbots
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbots"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: openbots-api
    env_file: .env
    environment:
      DATABASE_URL: postgres://openbots:openbots@postgres:5432/openbots
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/e2e/fixtures/testrepo:/tmp/testrepo:ro
      - ./apps/api/e2e/fixtures/writable-testrepo:/tmp/writable-testrepo:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: openbots-api
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://openbots:openbots@postgres:5432/openbots
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api/e2e/fixtures/testrepo:/tmp/testrepo:ro
      - ./apps/api/e2e/fixtures/writable-testrepo:/tmp/writable-testrepo:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
